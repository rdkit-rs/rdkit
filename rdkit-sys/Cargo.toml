[package]
name = "rdkit-sys"
authors = ["Xavier Lange (xrlange@gmail.com)", "chrissly31415"]
version = "0.4.12"
edition = "2021"
license = "MIT"
description = "CXX bindings to the RDKit C++ library"
links = "rdkit"
repository = "https://github.com/rdkit-rs/rdkit/tree/main/rdkit-sys"
exclude = ["rdkit-*", "*.tar.gz", "examples/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cxx = "1.0.203"

[build-dependencies]
cxx-build = "1.0.203"

[features]
default = []
dynamic-linking-from-conda = []
