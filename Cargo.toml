[package]
name = "rdkit"
version = "0.4.12"
edition = "2021"
authors = ["Xavier Lange <xrlange@gmail.com>", "Javier Pineda <javierjpineda13@gmail.com"]
license = "MIT"
description = "High level RDKit functionality for rust"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["rdkit-sys"]

[dependencies]
bitvec = "1"
byteorder = "1.4.3"
cxx = "1.0.203"
flate2 = "1"
log = "0.4"
rdkit-sys = { path = "rdkit-sys", version = "=0.4.12" }
thiserror = "1"

[features]
default = []
dynamic-linking-from-conda = ["rdkit-sys/dynamic-linking-from-conda"]

[[bench]]
name = "molecule_benchmark"
harness = false

[dev-dependencies]
trybuild = "1"
static_assertions = "1"
env_logger = "0.9.0"
